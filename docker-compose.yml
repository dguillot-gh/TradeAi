version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tradeai
      POSTGRES_PASSWORD: tradeai_dev
      POSTGRES_DB: tradeai
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8050:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://tradeai:tradeai_dev@db:5432/tradeai
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
