<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TradeAI.Mobile</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/TradeAI.SharedUI/app.css" />
    <link rel="stylesheet" href="mobile.css" />
    <link rel="stylesheet" href="TradeAI.Mobile.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        window.drawChart = (canvasId, labels, data, isProfit) => {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            
            if (window.myCharts && window.myCharts[canvasId]) {
                window.myCharts[canvasId].destroy();
            } else if (!window.myCharts) {
                window.myCharts = {};
            }

            const color = isProfit ? '#10b981' : '#ef4444';
            const bgColor = isProfit ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)';

            window.myCharts[canvasId] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Price',
                        data: data,
                        borderColor: color,
                        backgroundColor: bgColor,
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { display: false },
                        y: { 
                            display: true,
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        }
                    }
                }
            });
        };

        window.drawDonutChart = (canvasId, labels, data, colors) => {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            
            if (window.myCharts && window.myCharts[canvasId]) {
                window.myCharts[canvasId].destroy();
            } else if (!window.myCharts) {
                window.myCharts = {};
            }

            window.myCharts[canvasId] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: 'rgba(255,255,255,0.7)',
                                padding: 20,
                                font: {
                                    size: 12,
                                    family: "'Inter', sans-serif"
                                }
                            }
                        }
                    }
                }
            });
        };
    </script>
</body>

</html>
